# Copy to k8s/secret.yaml, fill in real values, and DO NOT commit the filled copy.
# (In a GitOps repo, use a SealedSecret / SOPS-encrypted secret instead.)
#
#   JWT_SECRET     — a long random string; signs/verifies login tokens.
#                    Generate: openssl rand -base64 48
#   S3_ACCESS_KEY  — MinIO access key (create a dedicated user/policy for gruesome)
#   S3_SECRET_KEY  — MinIO secret key
apiVersion: v1
kind: Secret
metadata:
  name: gruesome-secrets
  namespace: gruesome
type: Opaque
stringData:
  JWT_SECRET: "__CHANGE_ME_openssl_rand_base64_48__"
  S3_ACCESS_KEY: "__MINIO_ACCESS_KEY__"
  S3_SECRET_KEY: "__MINIO_SECRET_KEY__"
