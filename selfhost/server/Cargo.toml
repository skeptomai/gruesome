[package]
name = "gruesome-platform-server"
version = "0.1.0"
edition = "2021"
description = "Self-hosted storage + auth backend for the Gruesome web platform (replaces the AWS Lambda/Cognito/DynamoDB/S3 stack)"
license = "MIT"

[[bin]]
name = "gruesome-platform-server"
path = "src/main.rs"

[dependencies]
# Web
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# Object store (MinIO via the S3-compatible SDK)
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"

# Auth
argon2 = "0.5"
jsonwebtoken = "9"

# Misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
